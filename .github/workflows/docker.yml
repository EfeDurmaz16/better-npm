name: Docker
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['docker/**', 'crates/**', 'src/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [full, slim]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile${{ matrix.variant == 'slim' && '.slim' || '' }}
          push: ${{ github.event_name == 'release' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/better:${{ matrix.variant == 'slim' && 'slim' || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/better:${{ github.ref_name }}-${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
