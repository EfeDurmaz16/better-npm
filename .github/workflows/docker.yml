# .github/workflows/docker.yml
name: Docker

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'crates/**'
      - 'src/**'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [full, slim]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile${{ matrix.variant == 'slim' && '.slim' || '' }}
          push: ${{ github.event_name == 'release' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/better:${{ matrix.variant == 'slim' && 'slim-latest' || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/better:${{ github.ref_name }}-${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
