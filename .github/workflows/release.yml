name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: better-core
          - os: macos-13
            target: x86_64-apple-darwin
            binary: better-core
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: better-core
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: better-core
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: better-core
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        env:
          BUILD_TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --manifest-path crates/Cargo.toml -p better-core --release --target "$BUILD_TARGET"
          else
            cargo build --manifest-path crates/Cargo.toml -p better-core --release --target "$BUILD_TARGET"
          fi

      - name: Package
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "crates/target/${BUILD_TARGET}/release/better-core" dist/better-core
          cd dist
          tar -czf "better-${BUILD_TARGET}.tar.gz" better-core
          shasum -a 256 "better-${BUILD_TARGET}.tar.gz" > "better-${BUILD_TARGET}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-${{ matrix.target }}
          path: dist/better-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
