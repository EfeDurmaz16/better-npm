name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build native components from checkout
        run: |
          cargo build --locked --manifest-path crates/Cargo.toml -p better-core -p better-napi --release
          case "$RUNNER_OS" in
            Linux) cp crates/target/release/libbetter_napi.so crates/better-napi/better-core.node ;;
            macOS) cp crates/target/release/libbetter_napi.dylib crates/better-napi/better-core.node ;;
          esac

      - name: Verify native components load
        run: |
          node --input-type=module -e '
            import { findBetterCore, tryLoadNapiAddon } from "./src/lib/core.js";
            import assert from "node:assert/strict";
            import path from "node:path";
            assert.equal(await findBetterCore(), path.resolve("crates/target/release/better-core"));
            assert.ok(tryLoadNapiAddon(), "checkout N-API addon must load");
          '


      - name: Test better-core
        # Existing tests mutate process-wide API-key environment variables.
        run: cargo test --locked --manifest-path crates/Cargo.toml -p better-core -- --test-threads=1

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Lint and build checks
        run: npm run lint && npm run build && npm run typecheck

      - name: Run Node.js tests
        run: node --test test/*.test.js
