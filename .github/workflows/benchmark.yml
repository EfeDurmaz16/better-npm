name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'package.json'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target/
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-cargo-

      - name: Build Rust core (PR)
        run: npm run core:build

      - name: Set up benchmark fixture
        run: |
          mkdir -p test/fixtures/benchmark-project
          # Create a minimal package.json + lockfile for benchmarking
          cat > test/fixtures/benchmark-project/package.json <<'JSON'
          {
            "name": "bench-fixture",
            "version": "1.0.0",
            "dependencies": {
              "lodash": "^4.17.21",
              "semver": "^7.6.0"
            }
          }
          JSON
          cd test/fixtures/benchmark-project && npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Run verified benchmark
        run: |
          node bin/better.js benchmark \
            --project-root test/fixtures/benchmark-project \
            --engine better --pm npm --frozen \
            --cold-rounds 1 --warm-rounds 3 \
            --json > /tmp/bench-pr.json

      # Hosted-runner timing is informational. Install/output failures still fail
      # the job; they must never be relabeled as a performance regression.
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-benchmark
          path: /tmp/bench-pr.json
          if-no-files-found: error
