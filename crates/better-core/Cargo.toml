[package]
name = "better-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "better_core"
path = "src/lib.rs"

[[bin]]
name = "better-core"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
rayon = "1"
base64 = "0.22"
notify = "6"
indicatif = "0.17"
toml = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"
gethostname = "0.4"
whoami = "1"
