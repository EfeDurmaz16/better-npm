[package]
name = "better-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
better-core = { path = "../better-core" }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
rayon = "1"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
napi-build = "2"
